name: Bug report / 问题反馈
description: Something does not work as described. / 软件没有按说明工作。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before posting, remove passwords, keys, activation codes, license files and other private data from logs and screenshots. Security problems go to support@betterone.top instead (see SECURITY.md).
        提交前请从日志和截图中删掉密码、密钥、激活码、授权文件等私密信息。安全问题请发邮件到 support@betterone.top（见 SECURITY.md），不要在这里提交。
  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: Output of `betterone-cs --version`, or System page → Version. / `betterone-cs --version` 的输出，或网页“系统”页的版本。
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System / 系统
      options:
        - Windows x64
        - Linux x86_64
        - Linux ARM64 (64-bit Raspberry Pi OS / 64 位树莓派系统)
        - Linux ARMv7 (32-bit Raspberry Pi OS / 32 位树莓派系统)
        - Buildroot / BusyBox
        - Other / 其他
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed with / 安装方式
      options:
        - Windows service installer / Windows 服务安装包
        - deb / rpm package / deb、rpm 软件包
        - Portable ZIP or tar.gz / 绿色版压缩包
        - Raspberry Pi image / 树莓派镜像
        - Other / 其他
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: Serial adapter / 串口适配器
      description: Model or chip (FTDI, CH340, PL2303, CP210x…) and how it connects to the device. / 型号或芯片，以及和设备的接法。
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected / 实际结果和预期结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / 日志
      description: The program log around the problem (Logs page → Program log, or `show logs` in the management CLI). / 出问题前后的程序日志（网页“日志”页 → 程序日志，或管理命令行的 `show logs`）。
      render: text
